<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
    <h2 class="text-2xl font-semibold text-gray-700 mb-4">Novo Lugar</h2>
    
    <form id="lugarForm" [formGroup]="camposForm" (ngSubmit)="salvar()">
        <div class="mb-4">
            <label for="nome" class="block text-gray-600 font-medium mb-2">Nome</label>
            <input type="text"
                   id="nome"
                   name="nome"
                   formControlName="nome"
                   placeholder="Informe o nome do lugar"
                   class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
                   required
            />
            <span class="text-red-500 text-sm" *ngIf="isCampoInvalido('nome')">
                Campo Obrigatório
            </span>
        </div>

        <div class="mb-4">
            <label for="categoria" class="block text-gray-600 font-medium mb-2">Categoria</label>
            <select
                   id="categoria"
                   name="categoria"
                   formControlName="categoria"
                   class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
                   required
            >
                <option value="" disabled>Selecione uma categoria</option>
                <option *ngFor="let categoria of categorias" [value]="categoria.nome">
                    {{ categoria.nome }}
                </option>
            </select>
            <span class="text-red-500 text-sm" *ngIf="isCampoInvalido('categoria')">
                Campo Obrigatório
            </span>
        </div>

        <div class="mb-4">
            <label for="localizacao" class="block text-gray-600 font-medium mb-2">Localização</label>
            <input type="text"
                   id="localizacao"
                   name="localizacao"
                   formControlName="localizacao"
                   placeholder="Informe a localização"
                   class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
                   required
            />
            <span class="text-red-500 text-sm" *ngIf="isCampoInvalido('localizacao')">
                Campo Obrigatório
            </span>
        </div>

        <div class="mb-4">
            <label for="urlFoto" class="block text-gray-600 font-medium mb-2">URL da foto</label>
            <input type="url"
                   id="urlFoto"
                   name="urlFoto"
                   formControlName="urlFoto"
                   placeholder="https://exemplo.com/foto.jpg"
                   class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
                   required
            />
            <span class="text-red-500 text-sm" *ngIf="isCampoInvalido('urlFoto')">
                Campo Obrigatório
            </span>
        </div>

        <div class="mb-4">
            <label for="avaliacao" class="block text-gray-600 font-medium mb-2">Avaliação</label>
            <input type="number"
                   id="avaliacao"
                   name="avaliacao"
                   formControlName="avaliacao"
                   placeholder="Informe a avaliação"
                   class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
                   required
            />
            <span class="text-red-500 text-sm" *ngIf="isCampoInvalido('avaliacao')">
                Campo Obrigatório
            </span>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-semibold p-3 rounded shadow hover:bg-blue-700">
            Cadastrar Lugar
        </button>
    </form>
</div>
